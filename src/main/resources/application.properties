spring.application.name=twitch-recommender
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${SERVER_PORT:8080}
twitch.client-id=${TWITCH_CLIENT_ID:}
twitch.access-token=${TWITCH_ACCESS_TOKEN:}
twitch.api-base-url=${TWITCH_API_BASE_URL:https://api.twitch.tv/helix/}
recommender.base-url=${RECOMMENDER_BASE_URL:http://127.0.0.1:8000}
recommender.connect-timeout-ms=${RECOMMENDER_CONNECT_TIMEOUT_MS:200}
